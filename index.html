<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Association Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Association Manager</h1>
      <p>Track member addresses, contributions, meetings, alerts, and minutes.</p>

      <section>
        <h2>Members</h2>
        <form id="member-form">
          <input id="member-name" type="text" placeholder="Member name" required />
          <input id="member-address" type="text" placeholder="House address" required />
          <button type="submit">Add member</button>
        </form>
        <ul id="member-list"></ul>
      </section>

      <section>
        <h2>Management Contributions</h2>
        <form id="contribution-form">
          <input id="contribution-member" type="text" placeholder="Member name" required />
          <input id="contribution-amount" type="number" step="0.01" min="0" placeholder="Amount" required />
          <input id="contribution-date" type="date" required />
          <button type="submit">Record contribution</button>
        </form>
        <ul id="contribution-list"></ul>
      </section>

      <section>
        <h2>Meeting Schedule</h2>
        <form id="meeting-form">
          <input id="meeting-title" type="text" placeholder="Meeting title" required />
          <input id="meeting-datetime" type="datetime-local" required />
          <textarea id="meeting-agenda" placeholder="Agenda" required></textarea>
          <button type="submit">Schedule meeting</button>
        </form>
        <ul id="meeting-list"></ul>
      </section>

      <section>
        <h2>Meeting Alerts</h2>
        <form id="alert-form">
          <select id="alert-meeting" required>
            <option value="">Choose a meeting</option>
          </select>
          <textarea id="alert-message" placeholder="Alert message" required></textarea>
          <button type="submit">Create alert</button>
        </form>
        <ul id="alert-list"></ul>
      </section>

      <section>
        <h2>Meeting Minutes</h2>
        <form id="minutes-form">
          <select id="minutes-meeting" required>
            <option value="">Choose a meeting</option>
          </select>
          <textarea id="minutes-content" placeholder="Meeting minutes" required></textarea>
          <button type="submit">Publish minutes</button>
        </form>
        <ul id="minutes-list"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
